name: zut_opv2v_point_pillar_selfatt
root_dir: "/home/caoyitong/DataProjects/v2x_datasets/ZUT_OPV2V/train"
validate_dir: "/home/caoyitong/DataProjects/v2x_datasets/ZUT_OPV2V/validate"
# Test is a hard-linked evaluation view of validate until a separately
# collected held-out test set is added.
test_dir: "/home/caoyitong/DataProjects/v2x_datasets/ZUT_OPV2V/test"

noise_setting:
  add_noise: false
  args:
    pos_std: 0.0
    rot_std: 0.0
    pos_mean: 0.0
    rot_mean: 0.0

yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: &batch_size 4
  epoches: 200
  eval_freq: 1
  save_freq: 2
  max_cav: &max_cav 2

# Randomize ego only when the selected view retains a non-self target. This
# preserves the rear-observes-front supervision instead of turning it into a
# large number of accidental negative samples. Evaluation is deterministic.
ego_selection:
  train: label_aware_random
  eval: '1'
remove_ego_object:
  center: [-2.38991334, 0.25333039, 0.73471033]
  tolerance: 1.0

input_source: ['lidar']
label_type: 'lidar'
comm_range: 70

fusion:
  core_method: 'intermediate'
  dataset: 'opv2v'
  args:
    proj_first: false

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 8]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-64, -32, -4, 64, 32, 4]

# With proj_first=false, applying the same transform independently in each
# CAV-local frame does not preserve the pairwise transform.  Keep geometry
# unchanged until augmentation is implemented in the common ego frame.
data_augment: []

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    # Median canonical Car dimensions across the retained experiment 1+2 boxes.
    l: 4.32
    w: 1.98
    h: 1.86
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl'
  max_num: 32
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

model:
  core_method: point_pillar_intermediate
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *anchor_num
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      voxel_size: *voxel_size
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
    dir_args: *dir_args

loss:
  core_method: point_pillar_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 2.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1.0e-10
    weight_decay: 1.0e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [140, 180]
