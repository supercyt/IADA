name: v2xset_to_dairv2x_pointpillar_attfuse_ssda

# Target domain: unlabeled DAIR-V2X-C training data. Validation labels are used
# only by the separate inference/evaluation entry point.
data_dir: "/home/caoyitong/DataProjects/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure"
root_dir: "/home/caoyitong/DataProjects/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/train.json"
validate_dir: "/home/caoyitong/DataProjects/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/val.json"
test_dir: "/home/caoyitong/DataProjects/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/val.json"

yaml_parser: "load_point_pillar_params"

train_params:
  batch_size: 4
  epoches: 30
  eval_freq: 1
  save_freq: 1
  max_cav: 2

noise_setting:
  add_noise: true
  args:
    pos_std: 0.2
    rot_std: 0.2
    pos_mean: 0
    rot_mean: 0

input_source: ['lidar']
label_type: 'lidar'
comm_range: 100

fusion:
  core_method: 'intermediate'
  dataset: 'dairv2x'
  args:
    proj_first: false

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 5]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  # A common target-centric grid is required when concatenating both domains.
  cav_lidar_range: &cav_lidar [-100.8, -40, -3.5, 100.8, 40, 1.5]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: ['x']
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 4.5
    w: 2.0
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

model:
  core_method: point_pillar_baseline
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *anchor_num

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]

    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      resnet: false
      voxel_size: *voxel_size
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]

    fusion_method: att
    att:
      feat_dim: 384

    domain_adapter:
      # The training CLI changes these two fields for --stage baseline/ssda.
      enabled: false
      method: none
      hidden_dim: 128
      ssda_hidden_dim: 128
      sao_enabled: true
      sao_probability: 1.0
      fsa_epsilon: 0.00001
      ssda_detach_attention: false

    dir_args: *dir_args

loss:
  core_method: point_pillar_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      # Selective Shift equation (15) sets alpha=2.5 for L_reg.
      weight: 2.5
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args

optimizer:
  core_method: Adam
  # The paper reports Adam with lr=0.01 and a 0.1 decay every 15 epochs.
  lr: 0.01
  args:
    eps: 1.0e-10
    weight_decay: 1.0e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [15]

domain_adaptation:
  # Omit pretrained_model_dir for a scratch comparison, or pass a matching
  # source-only checkpoint to warm-start the detector.
  stage: baseline
  mode: source_only
  seed: 303
  source:
    root_dir: "/home/caoyitong/DataProjects/v2x_datasets/V2XSET/train"
    validate_dir: "/home/caoyitong/DataProjects/v2x_datasets/V2XSET/validate"
    test_dir: "/home/caoyitong/DataProjects/v2x_datasets/V2XSET/test"
    fusion:
      dataset: 'v2xset'

  source_batch_size: 4
  target_batch_size: 4
  num_workers: 4
  steps_per_epoch: null
  log_freq: 10

  # Selective Shift equation (18): beta_1=0.5, beta_2=1.0.
  ssda_global_weight: 0.5
  ssda_local_weight: 1.0

  # These LR scales apply only when a matching source baseline is supplied.
  # Scratch runs train the detector and FSA/SAA together at optimizer.lr.
  pretrained_lr_scale: 0.1
  adapter_lr_scale: 1.0
  gradient_clip_norm: 10.0
  grl:
    max_value: 1.0
    gamma: 10.0
  pretrained_model_dir: ""
