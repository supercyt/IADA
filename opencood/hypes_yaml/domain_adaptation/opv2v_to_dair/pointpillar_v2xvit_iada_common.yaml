base_config: pointpillar_v2xvit_da.yaml

# Shared by the four cumulative IADA ablations. Update this one path after
# retraining the matching source-only V2X-ViT baseline.
model:
  args:
    domain_adapter:
      # The 100x252 BEV makes topk=256 too sparse (~1%).
      iada_local_topk: 512

train_params:
  epoches: 15
  eval_freq: 1
  save_freq: 1

  lr_scheduler:
    core_method: multistep
    gamma: 0.1
    step_size: [5, 10]

domain_adaptation:
  stage: iada
  pretrained_model_dir: opencood/logs/opv2v_to_dairv2x_pointpillar_v2xvit_da_baseline_2026_08_12_11_11_38
  pretrained_lr_scale: 0.05
  adapter_lr_scale: 0.5
  iada_gate_identity_weight: 0.1
  iada_effect_variance_weight: 0.0
  grl:
    max_value: 0.5
    gamma: 5.0
