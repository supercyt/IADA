name: opv2v_to_dairv2x_pointpillar_v2xvit_ssda_lowres

# Dedicated low-resolution SSDA config. Keep the shared V2X-ViT config unchanged.

# Target-centric top level: saved checkpoints can be evaluated directly by
# the existing DAIR-V2X inference entry point.
data_dir: "/mnt/sdb/caoyitong/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure"
root_dir: "/mnt/sdb/caoyitong/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/train.json"
validate_dir: "/mnt/sdb/caoyitong/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/val.json"
test_dir: "/mnt/sdb/caoyitong/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/val.json"

yaml_parser: "load_point_pillar_params"

train_params:
  batch_size: 1
  epoches: 60
  eval_freq: 2
  save_freq: 2
  max_cav: 2

noise_setting:
  add_noise: true
  args:
    pos_std: 0.2
    rot_std: 0.2
    pos_mean: 0
    rot_mean: 0

input_source: ['lidar']
label_type: 'lidar'
comm_range: 100

fusion:
  core_method: 'intermediate'
  dataset: 'dairv2x'
  args:
    proj_first: false

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 5]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-100.8, -40, -3.5, 100.8, 40, 1.5]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: ['x']
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 4.5
    w: 2.0
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 4
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

model:
  core_method: point_pillar_baseline
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *anchor_num

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]

    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      resnet: false
      voxel_size: *voxel_size
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]

    shrink_header:
      kernal_size: [3]
      # Downsample only this SSDA model to a 50 x 126 fusion grid.
      stride: [2]
      padding: [1]
      dim: [256]
      input_dim: 384

    fusion_method: v2xvit
    v2xvit:
      # Used only when inference input omits prior_encoding. Training always
      # supplies an explicit prior, so OPV2V's all-zero prior overrides this.
      prior_encoding_fallback: local_index_1_infra
      transformer:
        encoder:
          num_blocks: 1
          depth: 3
          use_roi_mask: true
          use_RTE: false
          RTE_ratio: 0
          cav_att_config:
            dim: 256
            use_hetero: true
            use_RTE: false
            RTE_ratio: 0
            heads: 8
            dim_head: 32
            dropout: 0.3
          pwindow_att_config:
            dim: 256
            heads: [16, 8, 4]
            dim_head: [16, 32, 64]
            dropout: 0.3
            # 50 x 126 is divisible by one and two, but not four.
            window_size: [1, 2, 2]
            relative_pos_embedding: true
            fusion_method: 'split_attn'
          feed_forward:
            mlp_dim: 256
            dropout: 0.3
          sttf:
            voxel_size: *voxel_size
            downsample_rate: 2

    domain_adapter:
      enabled: true
      method: ssda
      hidden_dim: 128
      feature_size: [50, 126]
      dusa_lsa_hidden_dim: 1024
      dusa_cia_hidden_dim: 512
      lsa_grl_scale: 0.05
      cia_grl_scale: 0.1
      graph_dim: 256
      geometry_scale: 100.0
      normalize_domain_embedding: true
      iada_hidden_dim: 64
      iada_effect_dim: 64
      iada_gate_limit: 0.25
      iada_domain_hidden_dim: 64
      iada_local_topk: 256
      iada_source_supervision_enabled: true
      iada_target_consistency_enabled: false
      iada_effect_memory_enabled: false
      iada_consistency_dropout: 0.1
      iada_teacher_momentum: 0.999
      iada_prototype_momentum: 0.99
      cudax_hidden_dim: 256
      ckt_groups: 8
      ckt_shuffle_groups: 2
      cudax_bin_count: 5
      cpa_hidden_dim: 1024
      ssda_hidden_dim: 32
      sao_enabled: true
      sao_probability: 1.0
      fsa_epsilon: 0.00001
      ssda_detach_attention: true

    dir_args: *dir_args

loss:
  core_method: point_pillar_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 2.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args

optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1.0e-10
    weight_decay: 1.0e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 50]

domain_adaptation:
  stage: ssda
  mode: uda
  seed: 303
  source:
    root_dir: "/mnt/sdb/caoyitong/v2x_datasets/OPV2V/train"
    validate_dir: "/mnt/sdb/caoyitong/v2x_datasets/OPV2V/validate"
    test_dir: "/mnt/sdb/caoyitong/v2x_datasets/OPV2V/test"
    fusion:
      dataset: 'opv2v'

  source_batch_size: 1
  target_batch_size: 1
  num_workers: 4
  steps_per_epoch: null
  log_freq: 10
  domain_loss_weight: 0.1
  dusa_lsa_weight: 1.0
  dusa_cia_weight: 1.0
  cudax_bin_loss_weight: 0.1
  cudax_domain_loss_weight: 0.1
  iada_safe_weight: 0.05
  iada_correction_weight: 0.0
  iada_utility_weight: 0.0
  iada_consistency_weight: 0.0
  iada_effect_weight: 0.0
  iada_global_domain_weight: 0.05
  iada_local_domain_weight: 0.05
  iada_gate_identity_weight: 0.1
  iada_effect_variance_weight: 0.01
  iada_effect_target_std: 0.05
  iada_source_adapter_only: true
  iada_target_adapter_only: true
  iada_safe_margin: 0.0
  iada_target_confidence_threshold: 0.6
  iada_target_advantage_threshold: 0.03
  iada_discovery_ego_threshold: 0.5
  iada_refinement_error_threshold: 0.1
  iada_prototype_momentum: 0.99
  ssda_global_weight: 0.5
  ssda_local_weight: 1.0
  cudax_bin_count: 5
  # REQUIRED before --stage cudax. Compute these six positive encoded-residual
  # bounds in [dx, dy, dz, dlog_h, dlog_w, dlog_l] order using only positive
  # anchors in the OPV2V source training split.
  cudax_residual_bounds: [0.347788833, 0.359736341, 1.20948187, 0.253829773, 0.1343223, 0.220715908]
  pretrained_lr_scale: 0.1
  adapter_lr_scale: 1.0
  graph_variance_weight: 1.0
  graph_variance_target_std: 0.01
  gradient_clip_norm: 10.0
  grl:
    max_value: 1.0
    gamma: 10.0
  pretrained_model_dir: ""
