name: opv2v_to_dairv2x_pointpillar_v2xvit_da

# Target-centric top level: saved checkpoints can be evaluated directly by
# the existing DAIR-V2X inference entry point.
data_dir: "/home/caoyitong/DataProjects/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure"
root_dir: "/home/caoyitong/DataProjects/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/train.json"
validate_dir: "/home/caoyitong/DataProjects/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/val.json"
test_dir: "/home/caoyitong/DataProjects/v2x_datasets/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/val.json"

yaml_parser: "load_point_pillar_params"

train_params:
  batch_size: 2
  epoches: 20
  eval_freq: 1
  save_freq: 1
  max_cav: 2

noise_setting:
  add_noise: true
  args:
    pos_std: 0.2
    rot_std: 0.2
    pos_mean: 0
    rot_mean: 0

input_source: ['lidar']
label_type: 'lidar'
comm_range: 100

fusion:
  core_method: 'intermediate'
  dataset: 'dairv2x'
  args:
    proj_first: false

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 5]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-100.8, -40, -3.5, 100.8, 40, 1.5]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: ['x']
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 4.5
    w: 2.0
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

model:
  core_method: point_pillar_baseline
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *anchor_num

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]

    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      resnet: false
      voxel_size: *voxel_size
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]

    shrink_header:
      kernal_size: [3]
      # Preserve the common 100 x 252 comparison grid. V2X-ViT's window
      # attention has no internal padding, so its windows below must divide
      # both spatial dimensions exactly.
      stride: [1]
      padding: [1]
      dim: [256]
      input_dim: 384

    fusion_method: v2xvit
    v2xvit:
      # Used only when inference input omits prior_encoding. Training always
      # supplies an explicit prior, so OPV2V's all-zero prior overrides this.
      prior_encoding_fallback: local_index_1_infra
      transformer:
        encoder:
          num_blocks: 1
          depth: 3
          use_roi_mask: true
          use_RTE: false
          RTE_ratio: 0
          cav_att_config:
            dim: 256
            use_hetero: true
            use_RTE: false
            RTE_ratio: 0
            heads: 8
            dim_head: 32
            dropout: 0.3
          pwindow_att_config:
            dim: 256
            heads: [16, 8, 4]
            dim_head: [16, 32, 64]
            dropout: 0.3
            window_size: [1, 2, 4]
            relative_pos_embedding: true
            fusion_method: 'split_attn'
          feed_forward:
            mlp_dim: 256
            dropout: 0.3
          sttf:
            voxel_size: *voxel_size
            downsample_rate: 2

    domain_adapter:
      enabled: false
      method: none
      hidden_dim: 128
      feature_size: [100, 252]
      dusa_lsa_hidden_dim: 1024
      dusa_cia_hidden_dim: 512
      lsa_grl_scale: 0.05
      cia_grl_scale: 0.1
      graph_dim: 256
      geometry_scale: 100.0
      normalize_domain_embedding: true
      cudax_hidden_dim: 256
      ckt_groups: 8
      ckt_shuffle_groups: 2
      cudax_bin_count: 5
      cpa_hidden_dim: 1024

    dir_args: *dir_args

loss:
  core_method: point_pillar_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 2.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args

optimizer:
  core_method: Adam
  lr: 0.0002
  args:
    eps: 1.0e-10
    weight_decay: 1.0e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 15]

domain_adaptation:
  stage: baseline
  mode: source_only
  seed: 303
  source:
    root_dir: "/home/caoyitong/DataProjects/v2x_datasets/OPV2V/train"
    validate_dir: "/home/caoyitong/DataProjects/v2x_datasets/OPV2V/validate"
    test_dir: "/home/caoyitong/DataProjects/v2x_datasets/OPV2V/test"
    fusion:
      dataset: 'opv2v'

  source_batch_size: 2
  target_batch_size: 2
  num_workers: 4
  steps_per_epoch: null
  log_freq: 10
  domain_loss_weight: 0.1
  dusa_lsa_weight: 1.0
  dusa_cia_weight: 1.0
  cudax_bin_loss_weight: 0.1
  cudax_domain_loss_weight: 0.1
  cudax_bin_count: 5
  # REQUIRED before --stage cudax. Compute these six positive encoded-residual
  # bounds in [dx, dy, dz, dlog_h, dlog_w, dlog_l] order using only positive
  # anchors in the OPV2V source training split.
  cudax_residual_bounds: []
  pretrained_lr_scale: 0.1
  adapter_lr_scale: 1.0
  graph_variance_weight: 1.0
  graph_variance_target_std: 0.01
  gradient_clip_norm: 10.0
  grl:
    max_value: 1.0
    gamma: 10.0
  pretrained_model_dir: ""
